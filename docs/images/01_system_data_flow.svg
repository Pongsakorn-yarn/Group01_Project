  <rect x="740" y="430" width="338" height="38" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="752" y="447" class="font-sans box-desc" style="font-weight:700;fill:#065f46;">① Hand Tracking (MediaPipe) + 3D IK</text>
  <text x="752" y="462" class="font-sans box-small">21 จุดมือ → solveIK(tx,ty,tz) → state.target</text>

  <rect x="740" y="476" width="338" height="38" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="752" y="493" class="font-sans box-desc" style="font-weight:700;fill:#065f46;">② EMA Smoothing Filter (ลูป 60 FPS)</text>
  <text x="752" y="508" class="font-sans box-small">กรอง state.target → state.current ให้นุ่มนวล</text>

  <rect x="740" y="522" width="338" height="38" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="752" y="539" class="font-sans box-desc" style="font-weight:700;fill:#065f46;">③ 4-Bar Forward Kinematics &amp; ฟิสิกส์</text>
  <text x="752" y="554" class="font-sans box-small">updateArmKinematics() 12 กลุ่ม, TCP, หยิบกล่อง</text>

  <rect x="740" y="568" width="338" height="38" rx="6" fill="#fffbeb" stroke="#fde68a"/>
  <text x="752" y="585" class="font-sans box-desc" style="font-weight:700;fill:#92400e;">④ WebSerial Bridge (25 Hz / ทุก ~40 ms)</text>
  <text x="752" y="600" class="font-sans box-small">sendSerialTelemetry() แปลงเป็น PWM 0..180°</text>

