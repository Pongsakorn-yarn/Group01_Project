  <text x="1210" y="419" class="font-mono box-file" style="fill:#b45309;">arduino_servo_bridge.ino</text>
  <text x="1210" y="443" class="font-sans box-desc">• loop(): Serial.readStringUntil('\n')</text>
  <text x="1210" y="463" class="font-sans box-desc">• แยกค่า 4 แกนด้วย sscanf("%d,%d,%d,%d")</text>
  <text x="1210" y="483" class="font-sans box-desc">• จำกัดช่วงปลอดภัย constrain(0, 180)</text>
  <text x="1210" y="503" class="font-sans box-desc">• สร้างสัญญาณ PWM ด้วย Servo.write()</text>
  <text x="1210" y="524" class="font-sans box-small" style="fill:#b45309;">* แนะนำใช้แหล่งจ่าย 5V แยก + Common GND</text>

