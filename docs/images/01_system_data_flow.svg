  <text x="1212" y="697" class="font-sans box-desc">• Servo 4 (Gripper)       : Arduino D9 | ESP32 G27</text>
  <text x="1212" y="719" class="font-sans box-small" style="fill:#92400e;">ท่าเริ่มต้น (Home Pose): 90°, 90°, 90°, 60°</text>

