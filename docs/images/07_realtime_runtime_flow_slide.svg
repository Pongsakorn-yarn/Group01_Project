<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      .sans { font-family: 'Leelawadee UI', 'Segoe UI', 'Noto Sans Thai', Tahoma, sans-serif; }
      .main-title { font-size: 44px; font-weight: 800; fill: #0f172a; letter-spacing: 0.5px; }
      .main-sub { font-size: 22px; font-weight: 500; fill: #475569; }
      .badge-txt { font-size: 18px; font-weight: 700; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .sec-pill { font-size: 20px; font-weight: 800; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .step-num { font-size: 34px; font-weight: 800; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .step-title { font-size: 30px; font-weight: 800; fill: #0f172a; text-anchor: middle; }
      .step-key { font-size: 24px; font-weight: 700; fill: #1e293b; text-anchor: middle; }
      .step-sub { font-size: 22px; font-weight: 500; fill: #475569; text-anchor: middle; }
      .kpi-num { font-size: 58px; font-weight: 800; text-anchor: middle; }
      .kpi-head { font-size: 26px; font-weight: 800; fill: #0f172a; text-anchor: middle; }
      .kpi-sub { font-size: 22px; font-weight: 500; fill: #475569; text-anchor: middle; }
    </style>

    <filter id="cardShadow" x="-1%" y="-2%" width="102%" height="108%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>

    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ea580c"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- พื้นหลังสีขาวสะอาด สัดส่วน 16:9 -->
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>

  <!-- Header Banner -->
  <rect x="60" y="28" width="1800" height="96" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8"/>
  <rect x="60" y="28" width="12" height="96" rx="6" fill="#1e3a5f"/>
  <text x="98" y="74" class="sans main-title">REAL-TIME RUNTIME FLOW</text>
  <text x="98" y="108" class="sans main-sub">ลำดับการทำงานแบบ Real-Time ตั้งแต่ตรวจจับมือจนถึงแขนกลจริง</text>

  <rect x="1556" y="52" width="276" height="48" rx="24" fill="#1e3a5f"/>
  <text x="1694" y="76" class="sans badge-txt">ISY49303 IoT • GROUP 01</text>

  <!-- ======================================================================= -->
  <!-- OUTER LOOP: 60 FPS (x=766..1860, y=156..732)                            -->
  <!-- ======================================================================= -->
  <rect x="766" y="156" width="1094" height="576" rx="20" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.6"/>
  <rect x="794" y="176" width="290" height="42" rx="21" fill="#16a34a"/>
  <text x="939" y="197" class="sans sec-pill">LOOP 60 FPS</text>

  <!-- INNER HARDWARE ZONE: USB WebSerial 25 Hz (x=1144..1836, y=236..704) -->
  <rect x="1144" y="236" width="692" height="468" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="2.4" stroke-dasharray="10,6"/>
  <rect x="1168" y="254" width="380" height="40" rx="20" fill="#ea580c"/>
  <text x="1358" y="274" class="sans sec-pill">USB WEBSERIAL • 25 Hz</text>

  <!-- ======================================================================= -->
  <!-- 5 CLEAN KEYNOTE STEPS                                                   -->
  <!-- ======================================================================= -->
  <g filter="url(#cardShadow)">

    <!-- STEP 1 -->
    <rect x="60" y="220" width="312" height="468" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2.6"/>
    <circle cx="216" cy="296" r="34" fill="#2563eb"/>
    <text x="216" y="296" class="sans step-num">1</text>
    <text x="216" y="384" class="sans step-title">รับภาพมือ</text>
    <line x1="112" y1="422" x2="320" y2="422" stroke="#bfdbfe" stroke-width="2.2"/>
    <text x="216" y="486" class="sans step-key">กล้อง Webcam</text>
    <text x="216" y="544" class="sans step-sub">หรือ Slider / Demo</text>
    <text x="216" y="602" class="sans step-sub">(ประมวลผล Local)</text>

    <!-- Arrow 1 -> 2 -->
    <line x1="372" y1="454" x2="410" y2="454" stroke="#2563eb" stroke-width="4.4" marker-end="url(#arr-blue)"/>

    <!-- STEP 2 -->
    <rect x="418" y="220" width="312" height="468" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.6"/>
    <circle cx="574" cy="296" r="34" fill="#7c3aed"/>
    <text x="574" y="296" class="sans step-num">2</text>
    <text x="574" y="384" class="sans step-title">AI คำนวณมุม</text>
    <line x1="470" y1="422" x2="678" y2="422" stroke="#ddd6fe" stroke-width="2.2"/>
    <text x="574" y="486" class="sans step-key">MediaPipe (21 จุด)</text>
    <text x="574" y="544" class="sans step-sub">วัดระยะจีบนิ้วมือ</text>
    <text x="574" y="602" class="sans step-sub">คำนวณมุม 4 แกน (IK)</text>

    <!-- Arrow 2 -> 3 -->
    <line x1="730" y1="454" x2="786" y2="454" stroke="#7c3aed" stroke-width="4.4" marker-end="url(#arr-purple)"/>

    <!-- STEP 3 -->
    <rect x="794" y="244" width="314" height="444" rx="18" fill="#ffffff" stroke="#059669" stroke-width="2.6"/>
    <circle cx="951" cy="316" r="34" fill="#059669"/>
    <text x="951" y="316" class="sans step-num">3</text>
    <text x="951" y="398" class="sans step-title">จำลองแขน 3D</text>
    <line x1="846" y1="432" x2="1056" y2="432" stroke="#a7f3d0" stroke-width="2.2"/>
    <text x="951" y="492" class="sans step-key">กรองสัญญาณ EMA</text>
    <text x="951" y="550" class="sans step-sub">ขยับโมเดล 3D (39 ชิ้น)</text>
    <text x="951" y="608" class="sans step-sub">อัปเดตตัวเลข HUD</text>

    <!-- Arrow 3 -> 4 -->
    <line x1="1108" y1="494" x2="1160" y2="494" stroke="#ea580c" stroke-width="4.4" marker-end="url(#arr-orange)"/>

    <!-- STEP 4 -->
    <rect x="1168" y="316" width="306" height="362" rx="18" fill="#ffffff" stroke="#ea580c" stroke-width="2.6"/>
    <circle cx="1321" cy="382" r="32" fill="#ea580c"/>
    <text x="1321" y="382" class="sans step-num">4</text>
    <text x="1321" y="454" class="sans step-title">ส่งคำสั่ง USB</text>
    <line x1="1216" y1="484" x2="1426" y2="484" stroke="#fed7aa" stroke-width="2.2"/>
    <text x="1321" y="544" class="sans step-key">แพ็กเก็ต 4 แกน (CSV)</text>
    <text x="1321" y="604" class="sans step-sub">ส่งผ่าน WebSerial</text>

    <!-- Arrow 4 -> 5 -->
    <line x1="1474" y1="494" x2="1508" y2="494" stroke="#d97706" stroke-width="4.4" marker-end="url(#arr-amber)"/>

    <!-- STEP 5 -->
    <rect x="1516" y="316" width="298" height="362" rx="18" fill="#ffffff" stroke="#d97706" stroke-width="2.6"/>
    <circle cx="1665" cy="382" r="32" fill="#d97706"/>
    <text x="1665" y="382" class="sans step-num">5</text>
    <text x="1665" y="454" class="sans step-title">ขับแขนกลจริง</text>
    <line x1="1564" y1="484" x2="1766" y2="484" stroke="#fde68a" stroke-width="2.2"/>
    <text x="1665" y="544" class="sans step-key">S3-CAM แปลง 3 PWM</text>
    <text x="1665" y="604" class="sans step-sub">ขับ 4× Servo (0–180°)</text>

  </g>

  <!-- ======================================================================= -->
  <!-- BOTTOM ROW: 3 BIG KPI CARDS (y=774..1040)                               -->
  <!-- ======================================================================= -->
  <g filter="url(#cardShadow)">

    <!-- KPI 1: 60 FPS -->
    <rect x="60" y="774" width="574" height="266" rx="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.4"/>
    <text x="347" y="868" class="sans kpi-num" fill="#16a34a">60 FPS</text>
    <text x="347" y="936" class="sans kpi-head">เรนเดอร์ 3D แบบ Real-Time</text>
    <text x="347" y="986" class="sans kpi-sub">อัปเดตทุก ~16.6 ms ภาพลื่นไหล</text>

    <!-- KPI 2: 25 Hz -->
    <rect x="673" y="774" width="574" height="266" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="2.4"/>
    <text x="960" y="868" class="sans kpi-num" fill="#ea580c">25 Hz</text>
    <text x="960" y="936" class="sans kpi-head">ส่งคำสั่ง USB WebSerial</text>
    <text x="960" y="986" class="sans kpi-sub">เว้นระยะทุก 40 ms ป้องกันบัฟเฟอร์เต็ม</text>

    <!-- KPI 3: 50 Hz -->
    <rect x="1286" y="774" width="574" height="266" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2.4"/>
    <text x="1573" y="868" class="sans kpi-num" fill="#2563eb">50 Hz</text>
    <text x="1573" y="936" class="sans kpi-head">สัญญาณ PWM ขับ Servo</text>
    <text x="1573" y="986" class="sans kpi-sub">ขับ 4× Servo จริง (ไฟเลี้ยง 5V 2A+)</text>

  </g>
</svg>
