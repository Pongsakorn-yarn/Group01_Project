<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      .sans { font-family: 'Leelawadee UI', 'Segoe UI', 'Noto Sans Thai', Tahoma, sans-serif; }
      .main-title { font-size: 44px; font-weight: 800; fill: #0f172a; letter-spacing: 0.5px; }
      .main-sub { font-size: 22px; font-weight: 500; fill: #475569; }
      .badge-txt { font-size: 18px; font-weight: 700; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .sec-pill { font-size: 20px; font-weight: 800; fill: #ffffff; text-anchor: middle; dominant-baseline: central; letter-spacing: 0.5px; }
      .cad-title { font-size: 28px; font-weight: 800; fill: #0f172a; text-anchor: middle; }
      .cad-sub { font-size: 22px; font-weight: 600; fill: #475569; text-anchor: middle; }
      .card-hdr { font-size: 27px; font-weight: 800; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .card-bullet { font-size: 26px; font-weight: 700; fill: #1e293b; text-anchor: middle; }
      .card-sub { font-size: 23px; font-weight: 500; fill: #475569; text-anchor: middle; }
      .arr-lbl { font-size: 16px; font-weight: 800; text-anchor: middle; }
    </style>

    <filter id="cardShadow" x="-1%" y="-2%" width="102%" height="108%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>

    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ea580c"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- พื้นหลังสีขาวสะอาด สัดส่วน 16:9 -->
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>

  <!-- Header Banner -->
  <rect x="60" y="28" width="1800" height="96" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8"/>
  <rect x="60" y="28" width="12" height="96" rx="6" fill="#1e3a5f"/>
  <text x="98" y="74" class="sans main-title">SYSTEM ARCHITECTURE</text>
  <text x="98" y="108" class="sans main-sub">ภาพรวมระบบ Digital Twin แขนกล 4-DOF (3D CAD → Web AI → GOOUUU ESP32-S3-CAM → 3 Servos)</text>

  <rect x="1556" y="52" width="276" height="48" rx="24" fill="#1e3a5f"/>
  <text x="1694" y="76" class="sans badge-txt">ISY49303 IoT • GROUP 01</text>

  <!-- ======================================================================= -->
  <!-- ROW 1: OFFLINE 3D CAD PIPELINE (y=154..352)                             -->
  <!-- ======================================================================= -->
  <rect x="60" y="154" width="1800" height="198" rx="18" fill="#faf5ff" stroke="#9333ea" stroke-width="2" stroke-dasharray="10,6"/>
  <rect x="92" y="172" width="276" height="38" rx="19" fill="#7c3aed"/>
  <text x="230" y="191" class="sans sec-pill">OFFLINE 3D CAD</text>

  <g filter="url(#cardShadow)">
    <!-- CAD 1 -->
    <rect x="92" y="226" width="510" height="102" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-width="2.2"/>
    <text x="347" y="268" class="sans cad-title">SolidCraft 3D CAD</text>
    <text x="347" y="306" class="sans cad-sub">โครงสร้าง 4-Bar • 39 ชิ้นส่วน</text>

    <!-- Arrow -->
    <line x1="602" y1="277" x2="678" y2="277" stroke="#7c3aed" stroke-width="4" marker-end="url(#arr-purple)"/>

    <!-- CAD 2 -->
    <rect x="688" y="226" width="510" height="102" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2.2"/>
    <text x="943" y="268" class="sans cad-title">Web 3D Model</text>
    <text x="943" y="306" class="sans cad-sub">ไฟล์ชุดโมเดล 3D โหลดเข้าเว็บทันที</text>

    <!-- Arrow -->
    <line x1="1198" y1="277" x2="1274" y2="277" stroke="#7c3aed" stroke-width="4" stroke-dasharray="8,5" marker-end="url(#arr-purple)"/>

    <!-- CAD 3 -->
    <rect x="1284" y="226" width="544" height="102" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-width="2.2"/>
    <text x="1556" y="268" class="sans cad-title">Standard 3D Exports</text>
    <text x="1556" y="306" class="sans cad-sub">.GLB (Viewer)  •  .STL (พิมพ์ 3D)  •  .URDF</text>
  </g>

  <!-- ======================================================================= -->
  <!-- ROW 2: REAL-TIME SYSTEM (y=412..1038)                                   -->
  <!-- ======================================================================= -->
  <rect x="60" y="412" width="1800" height="626" rx="20" fill="#f0f9ff" stroke="#0284c7" stroke-width="2.4"/>
  <rect x="92" y="434" width="316" height="40" rx="20" fill="#0284c7"/>
  <text x="250" y="454" class="sans sec-pill">REAL-TIME SYSTEM</text>

  <!-- Connector from Web 3D Model down to Card 2 -->
  <path d="M 943 328 L 943 386 L 739 386 L 739 494" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arr-blue)"/>
  <rect x="786" y="366" width="278" height="38" rx="19" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="925" y="385" class="sans arr-lbl" fill="#1d4ed8" dominant-baseline="central">โหลดโมเดล 3D เข้าเว็บ</text>

  <g filter="url(#cardShadow)">

    <!-- CARD 1: Web UI & Input -->
    <rect x="92" y="502" width="394" height="498" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="2.6"/>
    <path d="M 92 520 Q 92 502 110 502 L 468 502 Q 486 502 486 520 L 486 578 L 92 578 Z" fill="#2563eb"/>
    <text x="289" y="540" class="sans card-hdr">1. Web UI &amp; Input</text>

    <!-- Monitor / Camera Icon -->
    <circle cx="289" cy="662" r="52" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <rect x="255" y="636" width="68" height="44" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
    <line x1="275" y1="692" x2="303" y2="692" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="289" y1="680" x2="289" y2="692" stroke="#1e293b" stroke-width="3.5"/>
    <circle cx="289" cy="658" r="9" fill="none" stroke="#2563eb" stroke-width="2.8"/>

    <text x="289" y="772" class="sans card-bullet">กล้อง Webcam / Slider</text>
    <line x1="150" y1="806" x2="428" y2="806" stroke="#e2e8f0" stroke-width="2"/>
    <text x="289" y="858" class="sans card-bullet">หน้าเว็บ 3D Dashboard</text>
    <text x="289" y="906" class="sans card-sub">แสดงผล HUD แบบ Real-Time</text>

    <!-- Arrow 1 -> 2 -->
    <line x1="486" y1="750" x2="534" y2="750" stroke="#2563eb" stroke-width="4.2" marker-end="url(#arr-blue)"/>
    <text x="514" y="728" class="sans arr-lbl" fill="#1d4ed8">UI</text>
    <text x="514" y="778" class="sans arr-lbl" fill="#1d4ed8">Cam</text>

    <!-- CARD 2: AI & Digital Twin -->
    <rect x="542" y="502" width="394" height="498" rx="18" fill="#ffffff" stroke="#059669" stroke-width="2.6"/>
    <path d="M 542 520 Q 542 502 560 502 L 918 502 Q 936 502 936 520 L 936 578 L 542 578 Z" fill="#059669"/>
    <text x="739" y="540" class="sans card-hdr">2. AI &amp; Digital Twin</text>

    <!-- AI / 3D Nodes Icon -->
    <circle cx="739" cy="662" r="52" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2"/>
    <circle cx="739" cy="640" r="9" fill="#059669"/>
    <circle cx="714" cy="676" r="9" fill="#059669"/>
    <circle cx="764" cy="676" r="9" fill="#059669"/>
    <line x1="739" y1="640" x2="714" y2="676" stroke="#1e293b" stroke-width="3"/>
    <line x1="739" y1="640" x2="764" y2="676" stroke="#1e293b" stroke-width="3"/>
    <line x1="714" y1="676" x2="764" y2="676" stroke="#1e293b" stroke-width="3"/>

    <text x="739" y="772" class="sans card-bullet">Hand Tracking AI</text>
    <line x1="600" y1="806" x2="878" y2="806" stroke="#d1fae5" stroke-width="2"/>
    <text x="739" y="858" class="sans card-bullet">คำนวณ 4-Bar IK / FK</text>
    <text x="739" y="906" class="sans card-sub">จำลอง 3D ลื่นไหล (60 FPS)</text>

    <!-- Arrow 2 -> 3 -->
    <line x1="936" y1="750" x2="984" y2="750" stroke="#ea580c" stroke-width="4.2" marker-end="url(#arr-orange)"/>
    <text x="964" y="728" class="sans arr-lbl" fill="#c2410c">USB</text>
    <text x="964" y="778" class="sans arr-lbl" fill="#c2410c">25 Hz</text>

    <!-- CARD 3: ESP32 Controller -->
    <rect x="992" y="502" width="394" height="498" rx="18" fill="#ffffff" stroke="#ea580c" stroke-width="2.6"/>
    <path d="M 992 520 Q 992 502 1010 502 L 1368 502 Q 1386 502 1386 520 L 1386 578 L 992 578 Z" fill="#ea580c"/>
    <text x="1189" y="540" class="sans card-hdr">3. GOOUUU ESP32-S3-CAM</text>

    <!-- Microchip Icon -->
    <circle cx="1189" cy="662" r="52" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
    <rect x="1165" y="638" width="48" height="48" rx="8" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
    <rect x="1177" y="650" width="24" height="24" rx="4" fill="#ea580c"/>
    <line x1="1154" y1="652" x2="1165" y2="652" stroke="#1e293b" stroke-width="3"/>
    <line x1="1154" y1="672" x2="1165" y2="672" stroke="#1e293b" stroke-width="3"/>
    <line x1="1213" y1="652" x2="1224" y2="652" stroke="#1e293b" stroke-width="3"/>
    <line x1="1213" y1="672" x2="1224" y2="672" stroke="#1e293b" stroke-width="3"/>

    <text x="1189" y="772" class="sans card-bullet">รับคำสั่ง USB Serial</text>
    <line x1="1050" y1="806" x2="1328" y2="806" stroke="#ffedd5" stroke-width="2"/>
    <text x="1189" y="858" class="sans card-bullet">แยกค่ามุม 4 แกน (CSV)</text>
    <text x="1189" y="906" class="sans card-sub">สร้างสัญญาณ PWM (50 Hz)</text>

    <!-- Arrow 3 -> 4 -->
    <line x1="1386" y1="750" x2="1434" y2="750" stroke="#d97706" stroke-width="4.2" marker-end="url(#arr-amber)"/>
    <text x="1414" y="728" class="sans arr-lbl" fill="#b45309">4×</text>
    <text x="1414" y="778" class="sans arr-lbl" fill="#b45309">PWM</text>

    <!-- CARD 4: 4-DOF Robotic Arm -->
    <rect x="1442" y="502" width="386" height="498" rx="18" fill="#ffffff" stroke="#d97706" stroke-width="2.6"/>
    <path d="M 1442 520 Q 1442 502 1460 502 L 1810 502 Q 1828 502 1828 520 L 1828 578 L 1442 578 Z" fill="#d97706"/>
    <text x="1635" y="540" class="sans card-hdr">4. 4-DOF Robotic Arm</text>

    <!-- Robotic Arm Icon -->
    <circle cx="1635" cy="662" r="52" fill="#fefce8" stroke="#fde68a" stroke-width="2"/>
    <rect x="1609" y="684" width="52" height="12" rx="4" fill="#1e293b"/>
    <line x1="1624" y1="684" x2="1638" y2="654" stroke="#d97706" stroke-width="7" stroke-linecap="round"/>
    <line x1="1638" y1="654" x2="1662" y2="642" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
    <circle cx="1638" cy="654" r="6" fill="#ffffff" stroke="#1e293b" stroke-width="2.6"/>
    <circle cx="1662" cy="642" r="5" fill="#d97706"/>

    <text x="1635" y="772" class="sans card-bullet">4× มอเตอร์ Servo จริง</text>
    <line x1="1496" y1="806" x2="1774" y2="806" stroke="#fef3c7" stroke-width="2"/>
    <text x="1635" y="858" class="sans card-bullet">Base • Shoulder • Elbow</text>
    <text x="1635" y="906" class="sans card-sub">Gripper L/R (ไฟเลี้ยง 5V 3A–5A+)</text>

  </g>
</svg>
