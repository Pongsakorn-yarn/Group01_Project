<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      .sans { font-family: 'Leelawadee UI', 'Segoe UI', 'Noto Sans Thai', Tahoma, sans-serif; }
      .mono { font-family: 'Consolas', 'Courier New', monospace; }
      .main-title { font-size: 42px; font-weight: 800; fill: #0f172a; letter-spacing: 0.4px; }
      .main-sub { font-size: 21px; font-weight: 500; fill: #475569; }
      .badge-txt { font-size: 18px; font-weight: 700; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .tcp-name { font-size: 36px; font-weight: 800; fill: #0f172a; }
      .osi-pill-txt { font-size: 18px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
      .item-bold { font-size: 27px; font-weight: 800; fill: #0f172a; }
      .item-text { font-size: 26px; font-weight: 500; fill: #334155; }
      .item-mono { font-size: 24px; font-weight: 700; fill: #0369a1; }
      .flow-txt { font-size: 21px; font-weight: 800; fill: #0f172a; text-anchor: middle; dominant-baseline: central; }
      .flow-label { font-size: 18px; font-weight: 800; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
    </style>

    <filter id="cardShadow" x="-1%" y="-2%" width="102%" height="108%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>

    <marker id="arr-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- พื้นหลังสีขาวสะอาด สัดส่วน 16:9 สำหรับสไลด์นำเสนอ -->
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>

  <!-- Header Banner -->
  <rect x="60" y="28" width="1800" height="96" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8"/>
  <rect x="60" y="28" width="12" height="96" rx="6" fill="#1e3a5f"/>
  <text x="98" y="74" class="sans main-title">TCP/IP MODEL (4 Layers)</text>
  <text x="98" y="108" class="sans main-sub">สรุปโปรโตคอลและเส้นทางข้อมูลจริงของระบบ Digital Twin แขนกล 4-DOF</text>

  <!-- Project Pill Badge -->
  <rect x="1556" y="52" width="276" height="48" rx="24" fill="#1e3a5f"/>
  <text x="1694" y="76" class="sans badge-txt">ISY49303 IoT • GROUP 01</text>

  <!-- ======================================================================= -->
  <!-- 4 TCP/IP LAYERS (x=60..1860, width=1800)                                -->
  <!-- ======================================================================= -->
  <g filter="url(#cardShadow)">

    <!-- Layer 4: Application (OSI 7-5) -->
    <rect x="60" y="148" width="1800" height="222" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="2.4"/>
    <!-- App Window Icon -->
    <rect x="108" y="216" width="76" height="86" rx="10" fill="#ffffff" stroke="#1e293b" stroke-width="2.8"/>
    <rect x="108" y="216" width="76" height="22" rx="8" fill="#1e293b"/>
    <circle cx="122" cy="227" r="3.5" fill="#fb923c"/>
    <circle cx="134" cy="227" r="3.5" fill="#facc15"/>
    <circle cx="146" cy="227" r="3.5" fill="#4ade80"/>
    <rect x="122" y="250" width="18" height="16" rx="3" fill="#fed7aa" stroke="#ea580c" stroke-width="1.8"/>
    <line x1="148" y1="254" x2="172" y2="254" stroke="#1e293b" stroke-width="2.4"/>
    <line x1="148" y1="263" x2="168" y2="263" stroke="#1e293b" stroke-width="2.4"/>
    <line x1="122" y1="280" x2="172" y2="280" stroke="#1e293b" stroke-width="2.4"/>
    <line x1="122" y1="291" x2="160" y2="291" stroke="#1e293b" stroke-width="2.4"/>

    <text x="216" y="254" class="sans tcp-name">Application</text>
    <rect x="216" y="272" width="196" height="36" rx="18" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
    <text x="314" y="290" class="sans osi-pill-txt" fill="#c2410c">รวม OSI ชั้น 7 – 5</text>

    <line x1="530" y1="176" x2="530" y2="342" stroke="#fed7aa" stroke-width="2.2"/>

    <text x="572" y="212" class="sans item-text">• <tspan class="item-bold">HTTP / HTTPS:</tspan> โหลดหน้าเว็บ Dashboard (Three.js &amp; MediaPipe AI)</text>
    <text x="572" y="268" class="sans item-text">• <tspan class="item-bold">Digital Twin &amp; AI:</tspan> ตรวจจับมือ 21 จุด → คำนวณ 4-Bar IK/FK &amp; กรอง EMA</text>
    <text x="572" y="324" class="sans item-text">• <tspan class="item-bold">WebSerial (25 Hz):</tspan> ส่งแพ็กเก็ต CSV <tspan class="mono item-mono">"BASE,GRIP_L,GRIP_R\n"</tspan> ไป GOOUUU S3-CAM</text>

    <!-- Layer 3: Transport (OSI 4) -->
    <rect x="60" y="390" width="1800" height="164" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.4"/>
    <!-- TCP/UART Shield Icon -->
    <path d="M 146 430 L 184 442 L 184 474 C 184 498 166 510 146 518 C 126 510 108 498 108 474 L 108 442 Z" fill="#6d28d9" stroke="#1e293b" stroke-width="2.4"/>
    <text x="146" y="466" class="sans" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">TCP</text>
    <text x="146" y="489" class="sans" font-size="16" font-weight="800" fill="#ddd6fe" text-anchor="middle">UART</text>

    <text x="216" y="466" class="sans tcp-name">Transport</text>
    <rect x="216" y="484" width="186" height="36" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="309" y="502" class="sans osi-pill-txt" fill="#6d28d9">ตรงกับ OSI ชั้น 4</text>

    <line x1="530" y1="416" x2="530" y2="528" stroke="#ddd6fe" stroke-width="2.2"/>

    <text x="572" y="454" class="sans item-text">• <tspan class="item-bold">TCP (<tspan class="mono item-mono">Port 8080 / 443</tspan>):</tspan> รับ–ส่งไฟล์หน้าเว็บและไลบรารีอย่างครบถ้วน</text>
    <text x="572" y="512" class="sans item-text">• <tspan class="item-bold">USB Serial Byte Stream:</tspan> ส่งสตรีมคำสั่งต่อเนื่องเข้า UART Buffer ของ ESP32</text>

    <!-- Layer 2: Internet (OSI 3) -->
    <rect x="60" y="574" width="1800" height="164" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2.4"/>
    <!-- Globe Icon -->
    <circle cx="146" cy="656" r="40" fill="#60a5fa" stroke="#1e293b" stroke-width="2.6"/>
    <ellipse cx="146" cy="656" rx="18" ry="40" fill="none" stroke="#1e293b" stroke-width="2.2"/>
    <line x1="106" y1="656" x2="186" y2="656" stroke="#1e293b" stroke-width="2.2"/>
    <path d="M 113 636 Q 146 646 179 636" fill="none" stroke="#1e293b" stroke-width="2"/>
    <path d="M 113 676 Q 146 666 179 676" fill="none" stroke="#1e293b" stroke-width="2"/>

    <text x="216" y="650" class="sans tcp-name">Internet</text>
    <rect x="216" y="668" width="186" height="36" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="309" y="686" class="sans osi-pill-txt" fill="#1d4ed8">ตรงกับ OSI ชั้น 3</text>

    <line x1="530" y1="600" x2="530" y2="712" stroke="#bfdbfe" stroke-width="2.2"/>

    <text x="572" y="638" class="sans item-text">• <tspan class="item-bold">IPv4 (<tspan class="mono item-mono">127.0.0.1</tspan> / CDN):</tspan> ระบุปลายทาง Local Server &amp; โหลดไลบรารีจาก CDN</text>
    <text x="572" y="696" class="sans item-text">• <tspan class="item-bold">Point-to-Point USB:</tspan> ช่วงควบคุมฮาร์ดแวร์ผ่านสาย USB เชื่อมตรง <tspan font-style="italic" fill="#475569">(ไม่ใช้ IP Address)</tspan></text>

    <!-- Layer 1: Network Access (OSI 2-1) -->
    <rect x="60" y="758" width="1800" height="184" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.4"/>
    <!-- Wi-Fi + Port Icon -->
    <path d="M 116 824 Q 146 798 176 824" fill="none" stroke="#1e293b" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M 126 838 Q 146 820 166 838" fill="none" stroke="#1e293b" stroke-width="3.2" stroke-linecap="round"/>
    <circle cx="146" cy="850" r="4.5" fill="#1e293b"/>
    <rect x="122" y="864" width="48" height="36" rx="5" fill="#ffffff" stroke="#1e293b" stroke-width="2.6"/>
    <rect x="132" y="874" width="28" height="18" rx="2" fill="#1e293b"/>

    <text x="216" y="828" class="sans tcp-name">Network</text>
    <text x="216" y="868" class="sans tcp-name">Access</text>
    <rect x="216" y="884" width="196" height="36" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="314" y="902" class="sans osi-pill-txt" fill="#15803d">รวม OSI ชั้น 2 – 1</text>

    <line x1="530" y1="784" x2="530" y2="916" stroke="#bbf7d0" stroke-width="2.2"/>

    <text x="572" y="826" class="sans item-text">• <tspan class="item-bold">Wi-Fi / Ethernet &amp; USB-UART:</tspan> เชื่อมเครือข่าย &amp; สาย USB (<tspan class="mono item-mono">115200 baud, 8N1</tspan>)</text>
    <text x="572" y="886" class="sans item-text">• <tspan class="item-bold">PWM 50 Hz → 3× Servo:</tspan> ขับ <tspan class="mono item-mono">1× MG996R + 2× MG90S</tspan> (ไฟ <tspan class="mono item-mono">5V 3A–5A+</tspan> &amp; GND ร่วม)</text>

  </g>

  <!-- ======================================================================= -->
  <!-- BOTTOM REAL-TIME FLOW STRIP (y=966..1046)                               -->
  <!-- ======================================================================= -->
  <rect x="60" y="966" width="1800" height="80" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8"/>

  <rect x="82" y="986" width="184" height="40" rx="20" fill="#0284c7"/>
  <text x="174" y="1006" class="sans flow-label">DATA FLOW</text>

  <!-- 5 Flow Steps -->
  <rect x="292" y="982" width="268" height="48" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
  <text x="426" y="1006" class="sans flow-txt">1. Webcam + AI</text>
  <line x1="560" y1="1006" x2="596" y2="1006" stroke="#0284c7" stroke-width="3" marker-end="url(#arr-flow)"/>

  <rect x="602" y="982" width="286" height="48" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="745" y="1006" class="sans flow-txt">2. Web 3D Dashboard</text>
  <line x1="888" y1="1006" x2="924" y2="1006" stroke="#0284c7" stroke-width="3" marker-end="url(#arr-flow)"/>

  <rect x="930" y="982" width="286" height="48" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="1073" y="1006" class="sans flow-txt">3. WebSerial (25 Hz)</text>
  <line x1="1216" y1="1006" x2="1252" y2="1006" stroke="#0284c7" stroke-width="3" marker-end="url(#arr-flow)"/>

  <rect x="1258" y="982" width="268" height="48" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="1392" y="1006" class="sans flow-txt">4. S3-CAM (3 PWM)</text>
  <line x1="1526" y1="1006" x2="1562" y2="1006" stroke="#0284c7" stroke-width="3" marker-end="url(#arr-flow)"/>

  <rect x="1568" y="982" width="268" height="48" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="1702" y="1006" class="sans flow-txt">5. 4-DOF Servos</text>
</svg>
