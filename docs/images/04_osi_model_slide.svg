<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      .sans { font-family: 'Leelawadee UI', 'Segoe UI', 'Noto Sans Thai', Tahoma, sans-serif; }
      .mono { font-family: 'Consolas', 'Courier New', monospace; }
      .main-title { font-size: 42px; font-weight: 800; fill: #0f172a; letter-spacing: 0.4px; }
      .main-sub { font-size: 21px; font-weight: 500; fill: #475569; }
      .badge-txt { font-size: 18px; font-weight: 700; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .layer-num { font-size: 30px; font-weight: 800; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .layer-name { font-size: 30px; font-weight: 800; fill: #0f172a; }
      .layer-sub { font-size: 19px; font-weight: 600; fill: #475569; }
      .detail-head { font-size: 27px; font-weight: 800; fill: #0f172a; }
      .detail-text { font-size: 24px; font-weight: 500; fill: #334155; }
      .detail-mono { font-size: 23px; font-weight: 700; fill: #0369a1; }
      .map-title { font-size: 16px; font-weight: 700; fill: #64748b; text-anchor: middle; }
      .map-label { font-size: 22px; font-weight: 800; text-anchor: middle; }
    </style>

    <filter id="cardShadow" x="-1%" y="-2%" width="102%" height="108%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- พื้นหลังสีขาวสะอาด สัดส่วน 16:9 สำหรับสไลด์นำเสนอ -->
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>

  <!-- Header Banner -->
  <rect x="60" y="28" width="1800" height="96" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8"/>
  <rect x="60" y="28" width="12" height="96" rx="6" fill="#1e3a5f"/>
  <text x="98" y="74" class="sans main-title">OSI MODEL (7 Layers)</text>
  <text x="98" y="108" class="sans main-sub">สรุปสถาปัตยกรรมข้อมูลระบบ Digital Twin แขนกล 4-DOF (Hand Tracking → Web 3D → GOOUUU ESP32-S3-CAM)</text>

  <!-- Project Pill Badge -->
  <rect x="1556" y="52" width="276" height="48" rx="24" fill="#1e3a5f"/>
  <text x="1694" y="76" class="sans badge-txt">ISY49303 IoT • GROUP 01</text>

  <!-- ======================================================================= -->
  <!-- 7 OSI LAYERS (x=60..1660, height=116, step=130)                         -->
  <!-- ======================================================================= -->
  <g filter="url(#cardShadow)">

    <!-- Layer 7: Application -->
    <rect x="60" y="146" width="1600" height="116" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2.2"/>
    <circle cx="114" cy="204" r="28" fill="#ea580c"/>
    <text x="114" y="204" class="sans layer-num">7</text>
    <!-- Browser/Globe Icon -->
    <rect x="164" y="180" width="48" height="44" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="2.4"/>
    <line x1="164" y1="192" x2="212" y2="192" stroke="#1e293b" stroke-width="2.2"/>
    <circle cx="188" cy="208" r="10" fill="none" stroke="#1e293b" stroke-width="2"/>
    <line x1="178" y1="208" x2="198" y2="208" stroke="#1e293b" stroke-width="1.8"/>
    <ellipse cx="188" cy="208" rx="5" ry="10" fill="none" stroke="#1e293b" stroke-width="1.8"/>
    <text x="234" y="196" class="sans layer-name">Application</text>
    <text x="234" y="226" class="sans layer-sub">ชั้นประยุกต์ใช้งาน</text>
    <line x1="474" y1="166" x2="474" y2="242" stroke="#fed7aa" stroke-width="2"/>
    <text x="506" y="194" class="sans detail-head">Web 3D Dashboard &amp; AI Hand Tracking</text>
    <text x="506" y="232" class="sans detail-text">หน้าเว็บ <tspan class="mono detail-mono">index.html</tspan> (Three.js + MediaPipe AI) และเฟิร์มแวร์ <tspan class="mono detail-mono">ESP32</tspan></text>

    <!-- Layer 6: Presentation -->
    <rect x="60" y="276" width="1600" height="116" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2.2"/>
    <circle cx="114" cy="334" r="28" fill="#ea580c"/>
    <text x="114" y="334" class="sans layer-num">6</text>
    <!-- Document Icon -->
    <rect x="170" y="310" width="38" height="48" rx="5" fill="#ffffff" stroke="#1e293b" stroke-width="2.4"/>
    <line x1="178" y1="324" x2="200" y2="324" stroke="#1e293b" stroke-width="2.4"/>
    <line x1="178" y1="334" x2="200" y2="334" stroke="#1e293b" stroke-width="2.4"/>
    <line x1="178" y1="344" x2="194" y2="344" stroke="#1e293b" stroke-width="2.4"/>
    <text x="234" y="326" class="sans layer-name">Presentation</text>
    <text x="234" y="356" class="sans layer-sub">ชั้นแปลงรูปแบบข้อมูล</text>
    <line x1="474" y1="296" x2="474" y2="372" stroke="#fed7aa" stroke-width="2"/>
    <text x="506" y="324" class="sans detail-head">จัดรูปแบบแพ็กเก็ตและถอดรหัส 3D CAD</text>
    <text x="506" y="362" class="sans detail-text">แปลงมุม 3 Servo เป็น ASCII CSV <tspan class="mono detail-mono">"BASE,GRIP_L,GRIP_R\n"</tspan> และถอดรหัส <tspan class="mono detail-mono">Base64 CAD</tspan></text>

    <!-- Layer 5: Session -->
    <rect x="60" y="406" width="1600" height="116" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2.2"/>
    <circle cx="114" cy="464" r="28" fill="#ea580c"/>
    <text x="114" y="464" class="sans layer-num">5</text>
    <!-- Users/Session Icon -->
    <circle cx="182" cy="452" r="9" fill="#1e293b"/>
    <path d="M 166 478 C 166 466, 198 466, 198 478 Z" fill="#1e293b"/>
    <circle cx="202" cy="456" r="7" fill="#475569"/>
    <path d="M 190 478 C 190 469, 214 469, 214 478 Z" fill="#475569"/>
    <text x="234" y="456" class="sans layer-name">Session</text>
    <text x="234" y="486" class="sans layer-sub">ชั้นควบคุมการเชื่อมต่อ</text>
    <line x1="474" y1="426" x2="474" y2="502" stroke="#fed7aa" stroke-width="2"/>
    <text x="506" y="454" class="sans detail-head">ควบคุมเซสชัน WebSerial และกล้องเว็บแคม</text>
    <text x="506" y="492" class="sans detail-text">เปิด/ปิดพอร์ต <tspan class="mono detail-mono">WebSerial API</tspan> ส่งคำสั่งต่อเนื่อง <tspan class="mono detail-mono">25 Hz (ทุก 40 ms)</tspan></text>

    <!-- Layer 4: Transport -->
    <rect x="60" y="536" width="1600" height="116" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.2"/>
    <circle cx="114" cy="594" r="28" fill="#7c3aed"/>
    <text x="114" y="594" class="sans layer-num">4</text>
    <!-- Shield Icon -->
    <path d="M 188 568 L 209 576 L 209 594 C 209 608 199 616 188 621 C 177 616 167 608 167 594 L 167 576 Z" fill="#ffffff" stroke="#1e293b" stroke-width="2.4"/>
    <line x1="188" y1="572" x2="188" y2="617" stroke="#7c3aed" stroke-width="2.6"/>
    <text x="234" y="586" class="sans layer-name">Transport</text>
    <text x="234" y="616" class="sans layer-sub">ชั้นขนส่งข้อมูล</text>
    <line x1="474" y1="556" x2="474" y2="632" stroke="#ddd6fe" stroke-width="2"/>
    <text x="506" y="584" class="sans detail-head">TCP Ports (เว็บ) &amp; USB Serial Stream (ฮาร์ดแวร์)</text>
    <text x="506" y="622" class="sans detail-text"><tspan class="mono detail-mono">TCP Port 8080 / 443</tspan> โหลดเว็บครบถ้วน และส่งสตรีมไบต์เรียงลำดับเข้า <tspan class="mono detail-mono">UART ESP32</tspan></text>

    <!-- Layer 3: Network -->
    <rect x="60" y="666" width="1600" height="116" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2.2"/>
    <circle cx="114" cy="724" r="28" fill="#2563eb"/>
    <text x="114" y="724" class="sans layer-num">3</text>
    <!-- 4-Way Arrows Icon -->
    <line x1="188" y1="702" x2="188" y2="746" stroke="#1e293b" stroke-width="2.8"/>
    <line x1="166" y1="724" x2="210" y2="724" stroke="#1e293b" stroke-width="2.8"/>
    <polygon points="188,698 182,707 194,707" fill="#1e293b"/>
    <polygon points="188,750 182,741 194,741" fill="#1e293b"/>
    <polygon points="162,724 171,718 171,730" fill="#1e293b"/>
    <polygon points="214,724 205,718 205,730" fill="#1e293b"/>
    <text x="234" y="716" class="sans layer-name">Network</text>
    <text x="234" y="746" class="sans layer-sub">ชั้นเครือข่าย / IP</text>
    <line x1="474" y1="686" x2="474" y2="762" stroke="#bfdbfe" stroke-width="2"/>
    <text x="506" y="714" class="sans detail-head">IPv4 Addressing (Localhost &amp; CDN)</text>
    <text x="506" y="752" class="sans detail-text">ใช้ <tspan class="mono detail-mono">127.0.0.1</tspan> (Local Server) / IP ของ CDN  •  <tspan font-style="italic" fill="#475569">(ช่วงสาย USB เชื่อมตรงไม่ผ่าน IP)</tspan></text>

    <!-- Layer 2: Data Link -->
    <rect x="60" y="796" width="1600" height="116" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.2"/>
    <circle cx="114" cy="854" r="28" fill="#16a34a"/>
    <text x="114" y="854" class="sans layer-num">2</text>
    <!-- Switch / Frame Icon -->
    <rect x="164" y="840" width="48" height="28" rx="5" fill="#1e293b"/>
    <circle cx="174" cy="854" r="3.2" fill="#4ade80"/>
    <circle cx="184" cy="854" r="3.2" fill="#4ade80"/>
    <circle cx="194" cy="854" r="3.2" fill="#facc15"/>
    <circle cx="204" cy="854" r="3.2" fill="#38bdf8"/>
    <text x="234" y="846" class="sans layer-name">Data Link</text>
    <text x="234" y="876" class="sans layer-sub">ชั้นเชื่อมโยงข้อมูล</text>
    <line x1="474" y1="816" x2="474" y2="892" stroke="#bbf7d0" stroke-width="2"/>
    <text x="506" y="844" class="sans detail-head">เฟรมเครือข่าย (MAC) &amp; USB-UART Framing</text>
    <text x="506" y="882" class="sans detail-text">Wi-Fi / Ethernet (ฝั่งเว็บ) และเฟรม <tspan class="mono detail-mono">USB-UART 115200 baud, 8N1</tspan> ไปยัง ESP32</text>

    <!-- Layer 1: Physical -->
    <rect x="60" y="926" width="1600" height="116" rx="14" fill="#fefce8" stroke="#d97706" stroke-width="2.2"/>
    <circle cx="114" cy="984" r="28" fill="#d97706"/>
    <text x="114" y="984" class="sans layer-num">1</text>
    <!-- Signal Waveform Icon -->
    <polyline points="162,984 171,984 176,966 184,1002 192,968 199,998 205,984 214,984" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="234" y="976" class="sans layer-name">Physical</text>
    <text x="234" y="1006" class="sans layer-sub">ชั้นกายภาพ</text>
    <line x1="474" y1="946" x2="474" y2="1022" stroke="#fde68a" stroke-width="2"/>
    <text x="506" y="974" class="sans detail-head">สายสัญญาณและฮาร์ดแวร์แขนกลจริง</text>
    <text x="506" y="1012" class="sans detail-text">Webcam, สาย USB-C Data, สัญญาณ <tspan class="mono detail-mono">PWM 50 Hz</tspan> ขับ <tspan class="mono detail-mono">3× Servo</tspan> (ไฟ 5V 3A–5A+ &amp; GND ร่วม)</text>

  </g>

  <!-- ======================================================================= -->
  <!-- RIGHT SIDE: TCP/IP MAPPING BRACKETS (x=1678..1860)                      -->
  <!-- ======================================================================= -->
  <text x="1772" y="138" class="sans map-title">เทียบกับ TCP/IP</text>

  <!-- Layers 7-5 -> Application -->
  <path d="M 1678 164 L 1696 164 L 1696 504 L 1678 504" fill="none" stroke="#ea580c" stroke-width="3.2" stroke-linecap="round"/>
  <line x1="1696" y1="334" x2="1712" y2="334" stroke="#ea580c" stroke-width="3.2"/>
  <rect x="1712" y="302" width="148" height="64" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="1786" y="341" class="sans map-label" fill="#c2410c">Application</text>

  <!-- Layer 4 -> Transport -->
  <line x1="1678" y1="594" x2="1712" y2="594" stroke="#7c3aed" stroke-width="3.2"/>
  <rect x="1712" y="562" width="148" height="64" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1786" y="601" class="sans map-label" fill="#6d28d9">Transport</text>

  <!-- Layer 3 -> Internet -->
  <line x1="1678" y1="724" x2="1712" y2="724" stroke="#2563eb" stroke-width="3.2"/>
  <rect x="1712" y="692" width="148" height="64" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="1786" y="731" class="sans map-label" fill="#1d4ed8">Internet</text>

  <!-- Layers 2-1 -> Network Access -->
  <path d="M 1678 814 L 1696 814 L 1696 1024 L 1678 1024" fill="none" stroke="#16a34a" stroke-width="3.2" stroke-linecap="round"/>
  <line x1="1696" y1="919" x2="1712" y2="919" stroke="#16a34a" stroke-width="3.2"/>
  <rect x="1712" y="881" width="148" height="76" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="1786" y="913" class="sans map-label" fill="#15803d">Network</text>
  <text x="1786" y="941" class="sans map-label" fill="#15803d">Access</text>
</svg>
